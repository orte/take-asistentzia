name: Supabase keep-alive

# Evita que el proyecto gratuito de Supabase se pause por inactividad: una vez
# al día llama a la función pública get_seasons() a través de la Data API.
#
# Requiere dos secretos del repo (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL              -> https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  -> sb_publishable_...
#
# Nota: GitHub desactiva los workflows programados tras 60 días sin actividad en
# el repo. Si el proyecto queda muy parado, reactívalo (o lanza este manualmente
# con "Run workflow") para que siga sonando.

on:
  schedule:
    - cron: '17 6 * * *' # cada día a las 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a get_seasons()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -fsS -X POST \
            "$SUPABASE_URL/rest/v1/rpc/get_seasons" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
